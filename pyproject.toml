[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-autopsy"
version = "0.1.0"
description = "Zero-model cost autopsy of local Claude Code session logs (Codex support planned for v0.2): find actionable usage patterns in logs you already have."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "James3014" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
token-autopsy = "token_autopsy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
token_autopsy = ["default_prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
